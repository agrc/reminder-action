name: Pull Request Events
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-check:
    name: Lint and check types
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧵 Lint
        run: pnpm run lint

      - name: 🧪 Check types
        run: pnpm run check

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🧪 Run tests
        run: pnpm test

  build:
    name: Commit Release Assets
    runs-on: ubuntu-latest
    needs: [test-check, test-unit]
    if: ${{ github.event.sender.login == 'ugrc-release-bot[bot]' }}
    permissions:
      contents: write
    steps:
      - name: 🪙 Convert token
        uses: actions/create-github-app-token@v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.UGRC_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.UGRC_RELEASE_BOT_APP_KEY }}

      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false
          ref: ${{ github.head_ref }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build release assets
        run: pnpm run build

      - name: 🏗️ Commit and push if needed
        run: |
          git config user.name "${{ secrets.UGRC_RELEASE_BOT_NAME }}"
          git config user.email "${{ secrets.UGRC_RELEASE_BOT_EMAIL }}"
          git add dist/*
          if [ -z "$(git status --porcelain)" ]; then
            echo "no changes to dist/*"
            exit 0
          fi
          git commit -m 'chore: build release assets'
          git push

  integration-test:
    name: Integration test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: reminder-integration-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: ⬇️ Set up code
        uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11

      - name: ⎔ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: 📥 Download dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: 🏗️ Build release assets
        run: pnpm run build

      - name: ⬇️ Set up published creator
        uses: actions/checkout@v7
        with:
          repository: agrc/create-reminder-action
          # v1 (1.1.26): run the published bundle, not its undeclared testContextPath input.
          ref: c2025868f56a49dfc239012c78cb8e2beee5554e
          path: .integration/creator
          persist-credentials: false
          sparse-checkout: dist

      - name: 🧪 Verify deterministic action cooperation
        run: pnpm run test:integration
        env:
          INTEGRATION_MODE: mock
          CREATOR_ACTION_PATH: .integration/creator/dist/index.js
